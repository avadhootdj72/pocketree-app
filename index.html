<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/pocketree-app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pocketree: a private, offline-first budget and money planner.">
  <meta name="theme-color" content="#1F6B4C">

  <!-- iPhone Home Screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pocketree">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Pocketree</title>
  <style>
    html, body { margin: 0; background: #F4F7F5; height: 100%; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script src="pdfjs/pdf.min.js" defer></script>
  <script src="pdf_lines.js" defer></script>
  <script>
    // Ask the browser to keep Pocketree's data even when the phone is low on space.
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    // Offline support: the app keeps working without internet once opened.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
    window.addEventListener('flutter-first-frame', () => { const s = document.getElementById('splash'); if (s) s.remove(); });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
